[package]
name = "s2-gamedatagen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1", default-features = false, features = ["decoder", "std", "instr_info"] }
memchr = "2"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"

[[bin]]
name = "gdgen"
path = "src/main.rs"

[profile.release]
debug = false
